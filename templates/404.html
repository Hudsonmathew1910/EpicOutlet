{% extends "shop/layouts/main.html" %}

{% block content %}
<div class="container">

    <div class="icon"><i class="fa-solid fa-compass" aria-hidden="true"></i></div>
    <h1 class="h2">We couldn't find that page</h1>

  </div>
</div>
