{% extends "shop/layouts/main.html" %}
{% block title %}
EpicOutlet | AI Assistant
{% endblock title %}

{% block content %}

<!-- Include Marked.js for Markdown parsing -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
/* Add simple styling for markdown tables */
.ai-message table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; color: #212529; }
.ai-message th, .ai-message td { padding: 0.75rem; vertical-align: top; border-top: 1px solid #dee2e6; }
.ai-message thead th { vertical-align: bottom; border-bottom: 2px solid #dee2e6; background-color: rgba(0,0,0,0.05); }
.message-content a { 
    color: #212529; 
    text-decoration: none; 
    font-weight: 600;
    transition: color 0.2s ease-in-out;
}
.message-content a:hover {
    color: #0d6efd;
    text-decoration: underline;
}
#margin-shop{
    margin-bottom:80px;
    margin-top:80px;
}

@media (max-width: 768px) {
    #margin-shop{
        margin-bottom:80px;
        margin-top:80px;
    }
    .chat-card{
        height: 800px;
    }
    
  .ai-message table,
  .ai-message thead,
  .ai-message tbody,
  .ai-message th,
  .ai-message td,
  .ai-message tr {
    display: block;
    width: 100%;
  }

  .ai-message thead {
    display: none; /* hide table header */
  }

  .ai-message tr {
    margin-bottom: 1rem;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    padding: 0.5rem;
  }

  .ai-message td {
    border: none;
    border-bottom: 1px solid #eee;
    padding: 0.5rem 0;
    text-align: left;
  }

  .ai-message td:last-child {
    border-bottom: none;
  }

  /* Show label before each cell */
  .ai-message td::before {
    content: attr(data-label);
    font-weight: bold;
    display: block;
    margin-bottom: 0.25rem;
  }
}
</style>

<div class="container" id="margin-shop">
    
    <h1 class="mb-4 text-center">EpicOutlet AI Assistant</h1>

    <div class="card shadow-lg chat-card">
        <div class="card-body chat-body" id="chatBody">

            <!-- Welcome Message -->
            <div class="chat-message ai-message">
                <div class="message-content">
                    👋 Hi! I'm your EpicOutlet assistant.  
                    Ask me about products, trends, vendors or deals!
                </div>
            </div>

        </div>

        <div class="card-footer chat-footer">
            <form id="chatForm" class="d-flex gap-2">
                <input 
                    type="text" 
                    id="userInput" 
                    class="form-control chat-input"
                    placeholder="Ask something..."
                    required
                >
                <button type="submit" class="btn pro-but px-4">
                    <i class="fa fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

</div>

<script>
const chatForm = document.getElementById("chatForm");
const userInput = document.getElementById("userInput");
const chatBody = document.getElementById("chatBody");

// Auto scroll
function scrollToBottom() {
    chatBody.scrollTop = chatBody.scrollHeight;
}

// Create message element
function createMessage(content, type) {
    const messageDiv = document.createElement("div");
    messageDiv.classList.add("chat-message", type === "user" ? "user-message" : "ai-message");

    const messageContent = document.createElement("div");
    messageContent.classList.add("message-content");
    
    if (type === "ai") {
        // Parse markdown content from the AI 
        messageContent.innerHTML = marked.parse(content);
    } else {
        // Plain text for user (escape to prevent XSS)
        messageContent.innerText = content;
    }

    messageDiv.appendChild(messageContent);
    chatBody.appendChild(messageDiv);
    scrollToBottom();
}

// Typing animation
function showTyping() {
    const typingDiv = document.createElement("div");
    typingDiv.classList.add("chat-message", "ai-message");
    typingDiv.setAttribute("id", "typingIndicator");

    typingDiv.innerHTML = `
        <div class="message-content typing">
            <span></span><span></span><span></span>
        </div>
    `;

    chatBody.appendChild(typingDiv);
    scrollToBottom();
}

function removeTyping() {
    const typing = document.getElementById("typingIndicator");
    if (typing) typing.remove();
}

chatForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const message = userInput.value.trim();
    if (!message) return;

    createMessage(message, "user");
    userInput.value = "";

    showTyping();

    // Replace this fetch URL with your Django backend endpoint
    fetch("/ai-chat/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({ message: message })
    })
    .then(response => response.json())
    .then(data => {
        removeTyping();
        createMessage(data.reply, "ai");
    })
    .catch(error => {
        removeTyping();
        createMessage("❗ Something went wrong. Please try again.", "ai");
    });
});
</script>

{% endblock content %}
