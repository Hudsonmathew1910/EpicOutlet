{% if messages %}
<script>
  window.EO_MESSAGES = [
    {% for msg in messages %}{ text: "{{ msg|escapejs }}", level: "{{ msg.tags|escapejs }}" }{% if not forloop.last %},{% endif %}{% endfor %}
  ];
</script>
<noscript>
  {% for msg in messages %}<div class="alert alert-info m-3">{{ msg }}</div>{% endfor %}
</noscript>
{% endif %}
